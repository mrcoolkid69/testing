<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan is cool</title>
    <style>
        body {
            background-image: linear-gradient(to right, #1180ff, #0027d4);
            text-align: center;
        }

        header {
            font-size: 10vw;
            color: aqua;
        }

        h1 {
            font-size: 8vw;
            color: aqua;
            text-align: center;
        }

        .info-box {
            background-color: #b8b7b7;
            width: 30vw;
            height: 150px;
            margin: auto;
            border-radius: 25px;
            border: #0027d4 solid 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .info-box:hover{
            transform: translateY(-4px);
            filter:drop-shadow(10px 10px 10px black);
        }
        .info-text {
            font-size: 30px;
            color: #006eff;
        }
 
        @media screen and (max-width: 520px) {
            .info-text{
                font-size:20px;
            }
            .info-box{
                height: 80px;
            }
            header{
                font-size:15vw; 
            }
            h1{
                font-size:12vw;
            }
        }
        @media screen and (max-width: 350px) {
            .info-box{
                width: 50vw;
            }
        }

        
    </style>
</head>

<body>
    <header>Ethan is cool</header>
    <h1>This is a cool site I am making...........</h1>
    <div class="info-box">
        <h3 class="info-text">This is a really cool site</h3>
    </div>
</body>

</html>
