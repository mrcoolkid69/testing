<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan is cool</title>
    <style>
        body {
            background-image: linear-gradient(to right, #1180ff, #0027d4);
            text-align: center;
        }

        header {
            font-size: 10vw;
            color: blue;
        }

        h1 {
            font-size: 8vw;
            color: aqua;
            text-align: center;
        }

        .info-box {
            background-color: #b8b7b7;
            width: 30vw;
            height: 100px;
            margin: auto;
            border-radius: 25px;
            border: #0027d4 solid 3px;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .info-text {
            font-size: 30px;
            color: #006eff;
        }

        @media screen and (max-width: 520px) {
            .info-text{
                font-size:15px;
            }
        }

        
    </style>
</head>

<body>
    <header>Ethan is cool</header>
    <h1>This is a cool site I am making...........</h1>
    <div class="info-box">
        <h3 class="info-text">This is a realy cool site</h3>
    </div>
</body>

</html>
